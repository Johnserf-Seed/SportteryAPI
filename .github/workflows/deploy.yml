name: Deploy

# CD — deploy to Cloudflare Workers after CI passes on main.
# Requires the CLOUDFLARE_API_TOKEN repo secret (Settings → Secrets and variables
# → Actions). If your token is scoped to multiple accounts, also add
# CLOUDFLARE_ACCOUNT_ID and pass it below.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; queue the newer one instead of cancelling mid-deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Deploy only when CI succeeded for a push to main in this repo (or when
    # triggered manually). `branches: [main]` alone also matches fork PRs whose
    # head branch happens to be named "main".
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      sha: ${{ steps.tip.outputs.sha }}
      deploy: ${{ steps.tip.outputs.deploy }}
    steps:
      # CI runs for back-to-back pushes can finish out of order, so a run only
      # deploys if its commit is still the tip of main — otherwise an older
      # commit could overwrite a newer release. main only moves forward (force
      # pushes are blocked), so the tip's own run deploys it. This check runs
      # inside the concurrency group, so it sees the latest tip.
      - name: Skip commits that main has moved past
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          # Deploy exactly the commit CI tested, not whatever main points to now.
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$tip" = "$SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping ${SHA:0:7}: main has moved on to ${tip:0:7}, whose own run deploys it."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}   # uncomment if needed
          command: deploy
